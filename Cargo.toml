[package]
name = "procactivity"
version = "0.1.0"
description = "procactivity tracks"
authors = ["David Bruant <davidbruant@protonmail.com>", "Jakob Waibel <salet@posteo.net>", "Yuri Astrakhan <YuriAstrakhan@gmail.com>"]
license = "MIT"
repository = "github.com/DavidBruant/procactivity"
edition = "2021"

[[bin]]
name = "lurk"
path = "src/main.rs"

[features]
default = []

# Includes the syscall tables for all architectures.
all = [
#    "arm", "mips", "mips64", "powerpc", "powerpc64", "s390x",
#    "sparc", "sparc64", "x86",
    "x86_64", "riscv64", "aarch64"
]

# Enable syscall tables for individual architectures.
aarch64 = []
#arm = []
#mips = []
#mips64 = []
#powerpc = []
#powerpc64 = []
#s390x = []
#sparc = []
#sparc64 = []
#x86 = []
x86_64 = []
riscv64 = []

[dependencies]
anyhow = "1"
byteorder = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
console = "0.16.1"
im = "15.1.0"
libc = "0.2"
nix = { version = "0.30.1", features = ["personality", "ptrace", "signal"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syscalls = { version = "0.8", features = ["full"] }
uzers = "0.12"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
